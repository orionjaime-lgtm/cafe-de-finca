spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/cafedefinca_db
spring.datasource.username=admin
spring.datasource.password=adminpassword

# El esquema lo manejan los archivos .sql, Hibernate solo verifica
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Un entero con decimales (ej: "idOrigen": 1.9) se rechaza con 400 en lugar de truncarse a 1 sin avisar
spring.jackson.deserialization.accept-float-as-int=false